<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` shrinks the page when the on-screen
      keyboard opens. The app is a full-height column with its own scrolling
      areas, so without it the keyboard covers the bottom of the screen -- and
      the bottom of the screen is where the search drawer opens.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Trip Planner</title>
    <meta name="description" content="Plan a trip together, with or without a signal." />

    <!-- iOS home-screen icon: Safari reads this, not the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Colors the browser chrome to match the page background per theme. The
      manifest's theme_color covers Android's installed app; these tags are what
      iOS Safari and the first paint read. Values track --surface-page in
      @trip/ui (grey-100 light, grey-850 dark).
    -->
    <meta name="theme-color" content="#e7eaee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2029" media="(prefers-color-scheme: dark)" />

    <!--
      Sets the theme before the first paint. It is inline and blocking on
      purpose: loaded as a module it would run after the page had already
      painted, and someone on the dark theme would see a white flash first.
      Kept in sync with THEME_INIT_SCRIPT in @trip/ui.
    -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('trip-planner:theme');
          if (c !== 'light' && c !== 'dark') {
            c = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = c;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
