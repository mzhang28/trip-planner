# Serves the built app and forwards the four path prefixes the API owns: the
# same set the Vite dev server proxies. /oauth, /mcp and /.well-known sit at the
# root rather than under /api because an MCP client is handed this origin and
# looks for them where the specs say they are.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An archive import can be 250 MB, which is the API's own ceiling.
    client_max_body_size 256m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    location ~ ^/(api|oauth|mcp|\.well-known)(/|$) {
        # Docker's embedded DNS, queried per request rather than once at
        # startup, so recreating the api container does not leave nginx holding
        # the address it used to have.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8787;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reading and unpacking a large archive takes longer than the minute
        # nginx allows by default.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite puts a content hash in every filename under here, so a cached copy is
    # never the wrong one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker decides when a new version gets offered. A cached one
    # keeps handing out the build it was cached with.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # nginx has no .webmanifest in its MIME map. An empty types block leaves
    # default_type to answer for this one file.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: a trip URL opened directly is not a file on disk.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
