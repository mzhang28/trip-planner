name: trip-planner

services:
  app:
    image: forgejo.apps.mzhang.io/michael/trip-planner:latest
    build: .
    # Set anything else, S3 credentials included, in a .env file beside this
    # one. See .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Fixed inside the container, so a PORT in .env cannot move the server out
      # from under the published port and the health check below.
      PORT: 8787
      # The origin browsers and MCP clients reach this at. Access tokens are
      # bound to it, so it has to be the real URL and it has to agree with
      # APP_PORT: change both before putting this anywhere.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    ports:
      - ${APP_PORT:-8787}:8787
    volumes:
      # DATABASE_PATH and BLOB_DIR default to data/trip-planner.db and
      # data/blobs under /app, so this one volume holds both.
      - trip-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8787/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  trip-data:
